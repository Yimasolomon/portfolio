{% extends "base.html" %}

{% block title %}projects{% endblock %}

{% block content %}
    <h1>My projects</h1>

    {% for project in projects %}
        <div class="card">
            <h2>{{ project.title }}</h2>
            <p>{{ project.description }}</p>
            <p>Built with: {{ project.tech | join(", ")}}</p>
            <a href="{{ project.link }}">view on GitHub</a>
        </div>
    {% endfor %}
{% endblock %}
