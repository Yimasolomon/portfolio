<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to my portfolio</h1>
    <p>I am {{ name }}, an {{ role }}.</p>

{{ name }} is a placeholder.Jinja replaces it with a value your python code supplies.
